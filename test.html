<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PB Clock</title>

    <style>
      @import url("https://fonts.googleapis.com/css2?family=Anta&display=swap");

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Anta", monospace;
        border: none;
        outline: none;
      }

      body {
        background: linear-gradient(135deg, #0b0b0b, #0f0f0f);
        width: 100vw;
        height: 100vh;
        color: #e8e8e8;
        overflow: hidden;
      }

      main {
        position: relative;
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }

      /* =========================
         VIEWS
         ========================= */

      .view {
        position: absolute;
        width: 100%;
        display: flex;
        align-items: center;
        flex-direction: column;
        gap: 20px;

        transform: translateX(100%);

        transition: transform 0.45s cubic-bezier(0.6, 0.04, 0.98, 0.335);
      }

      .view.active {
        transform: translateX(0);
      }

      .view.left {
        transform: translateX(-100%);
      }

      .view.right {
        transform: translateX(100%);
      }

      /* =========================
         TEXT
         ========================= */

      h1 {
        font-size: 100px;
      }

      /* =========================
         BUTTONS
         ========================= */

      button {
        display: grid;
        place-items: center;

        border-radius: 12px;
        border: 1px solid rgba(255, 255, 255, 0.12);

        background: rgba(255, 255, 255, 0.08);
        color: #e8e8e8;

        cursor: pointer;

        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);

        transition:
          background 0.2s ease,
          transform 0.2s ease;
      }

      button:hover {
        background: rgba(255, 255, 255, 0.14);
      }

      button:active {
        transform: scale(0.94);
      }

      /* =========================
         SWITCH
         ========================= */

      #left,
      #right {
        position: absolute;
        top: 50%;

        width: 44px;
        height: 44px;

        font-size: 24px;
        transform: translateY(-50%);
      }

      #left {
        left: 16px;
      }

      #right {
        right: 16px;
      }

      #left:active,
      #right:active {
        transform: translateY(-50%) scale(0.94);
      }

      /* =========================
         TIMER
         ========================= */

      #startTimer {
        padding: 12px 18px;
        font-size: 24px;
      }

      /* =========================
         FULLSCREEN
         ========================= */

      #fullscreenBtn {
        position: absolute;

        bottom: 16px;
        right: 16px;

        width: 48px;
        height: 48px;

        font-size: 24px;
      }
    </style>
  </head>

  <body>
    <main>
      <!-- CLOCK -->

      <div class="view active" id="clock">
        <h1>
          <span id="clockH">12</span>:<span id="clockM">34</span>:<span
            id="clockS"
            >56</span
          >
        </h1>
      </div>

      <!-- TIMER -->

      <div class="view right" id="timer">
        <h1><span id="timerM">25</span>:<span id="timerS">00</span></h1>

        <button id="startTimer">START TIMER</button>
      </div>

      <!-- SWITCH -->

      <button id="left">◁</button>
      <button id="right">▷</button>

      <!-- FULLSCREEN -->

      <button id="fullscreenBtn">▢</button>
    </main>

    <script>
      /* =========================
         CLOCK
         ========================= */

      const clockH = document.getElementById("clockH");
      const clockM = document.getElementById("clockM");
      const clockS = document.getElementById("clockS");

      function updateClock() {
        const now = new Date();

        clockH.textContent = String(now.getHours()).padStart(2, "0");
        clockM.textContent = String(now.getMinutes()).padStart(2, "0");
        clockS.textContent = String(now.getSeconds()).padStart(2, "0");
      }

      updateClock();
      setInterval(updateClock, 1000);

      /* =========================
         VIEW SWITCH
         ========================= */

      const views = [
        document.getElementById("clock"),
        document.getElementById("timer"),
      ];

      let currentView = 0;
      let isAnimating = false;

      function showView(newView, direction) {
        if (newView === currentView || isAnimating) {
          return;
        }

        isAnimating = true;

        const oldView = views[currentView];
        const nextView = views[newView];

        /* =========================
           PREPARE NEXT VIEW
           ========================= */

        nextView.classList.remove("active", "left", "right");

        if (direction === "right") {
          // New screen starts on the right
          nextView.classList.add("right");
        } else {
          // New screen starts on the left
          nextView.classList.add("left");
        }

        // Force browser to render starting position
        nextView.offsetWidth;

        /* =========================
           START ANIMATION
           ========================= */

        if (direction === "right") {
          // Old screen leaves to the left
          oldView.classList.remove("active");
          oldView.classList.add("left");

          // New screen enters from the right
          nextView.classList.remove("right");
          nextView.classList.add("active");
        } else {
          // Old screen leaves to the right
          oldView.classList.remove("active");
          oldView.classList.add("right");

          // New screen enters from the left
          nextView.classList.remove("left");
          nextView.classList.add("active");
        }

        currentView = newView;

        /* =========================
           CLEANUP
           ========================= */

        setTimeout(() => {
          isAnimating = false;
        }, 450);
      }

      /* =========================
         LEFT
         ========================= */

      document.getElementById("left").addEventListener("click", () => {
        let newView = currentView - 1;

        if (newView < 0) {
          newView = views.length - 1;
        }

        showView(newView, "left");
      });

      /* =========================
         RIGHT
         ========================= */

      document.getElementById("right").addEventListener("click", () => {
        let newView = currentView + 1;

        if (newView >= views.length) {
          newView = 0;
        }

        showView(newView, "right");
      });

      /* =========================
         TIMER
         ========================= */

      let timerSeconds = 25 * 60;
      let timerRunning = false;
      let timerInterval = null;

      const timerM = document.getElementById("timerM");
      const timerS = document.getElementById("timerS");
      const startTimer = document.getElementById("startTimer");

      function updateTimer() {
        const minutes = Math.floor(timerSeconds / 60);
        const seconds = timerSeconds % 60;

        timerM.textContent = String(minutes).padStart(2, "0");
        timerS.textContent = String(seconds).padStart(2, "0");
      }

      startTimer.addEventListener("click", () => {
        if (timerRunning) {
          clearInterval(timerInterval);

          timerRunning = false;
          startTimer.textContent = "START TIMER";

          return;
        }

        if (timerSeconds <= 0) {
          timerSeconds = 25 * 60;
        }

        timerRunning = true;
        startTimer.textContent = "PAUSE TIMER";

        timerInterval = setInterval(() => {
          timerSeconds--;

          updateTimer();

          if (timerSeconds <= 0) {
            clearInterval(timerInterval);

            timerRunning = false;
            startTimer.textContent = "START TIMER";
          }
        }, 1000);
      });

      updateTimer();

      /* =========================
         FULLSCREEN
         ========================= */

      const fullscreenBtn = document.getElementById("fullscreenBtn");

      fullscreenBtn.addEventListener("click", async () => {
        const elem = document.documentElement;

        try {
          if (elem.requestFullscreen) {
            await elem.requestFullscreen();
          } else if (elem.webkitRequestFullscreen) {
            await elem.webkitRequestFullscreen();
          } else if (elem.msRequestFullscreen) {
            await elem.msRequestFullscreen();
          }

          fullscreenBtn.style.display = "none";
        } catch (err) {
          console.error(`Error enabling fullscreen: ${err.message}`);
        }
      });

      document.addEventListener("fullscreenchange", () => {
        if (!document.fullscreenElement) {
          fullscreenBtn.style.display = "grid";
        }
      });
    </script>
  </body>
</html>
